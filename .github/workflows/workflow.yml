name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('api/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore api/WildRiftCounterLab.Api.slnx

      - name: Build
        run: dotnet build api/WildRiftCounterLab.Api.slnx --configuration Release --no-restore --warnaserror

      - name: Test
        shell: bash
        run: |
          set +e

          dotnet test api/WildRiftCounterLab.Services.Tests/WildRiftCounterLab.Services.Tests.csproj \
            --configuration Release \
            --no-restore \
            --no-build \
            --logger "trx;LogFileName=services-tests.trx" \
            --results-directory api/TestResults/Services
          services_status=$?

          dotnet test api/WildRiftCounterLab.Api.Tests/WildRiftCounterLab.Api.Tests.csproj \
            --configuration Release \
            --no-restore \
            --no-build \
            --logger "trx;LogFileName=api-tests.trx" \
            --results-directory api/TestResults/Api
          api_status=$?

          if [ "$services_status" -ne 0 ] || [ "$api_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: api/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish
        run: |
          dotnet publish api/WildRiftCounterLab.Api/WildRiftCounterLab.Api.csproj \
            --configuration Release \
            --no-restore \
            --output "${{ runner.temp }}/published-api" \
            -p:TreatWarningsAsErrors=true

  client:
    name: Client — lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

  docker:
    name: Docker — build image
    needs: [api, client]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: false
          tags: wildrift-counterlab-api:ci

  deploy:
    name: Deploy — Render + Vercel
    needs: [docker]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy API to Render
        run: |
          curl --silent --show-error --fail \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Deploy client to Vercel
        run: |
          curl --silent --show-error --fail \
            -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
